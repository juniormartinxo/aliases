[package]
name = "aliases"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shell-agnostic manager for aliases stored in ~/.config/aliases/aliases.d"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
terminal_size = "0.4"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
strip = true
lto = true
